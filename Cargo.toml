[package]
name = "mqtt_dos"
version = "0.1.0"
authors = ["Michael Jenkins <jenkinsmichpa@gmail.com>"]
edition = "2024"
description = "A tool to simulate different denial of service attacks on MQTT brokers"

[dependencies]
bytes = "1.11.0"
clap = { version = "4.5.53", features = ["derive"] }
mqttbytes = { version = "0.6.0", features = ["v5"] }
rand = "0.9.2"
rumqttc = "0.25.1"
tokio = { version = "1.48.0", features = ["net", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
